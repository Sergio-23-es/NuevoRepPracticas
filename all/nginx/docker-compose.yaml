version: "3.9"

services:

  sjp0005:
    build: ./sjp0005
    container_name: sjp0005
    expose:
      - "3000"

  nginx:
    image: nginx:latest
    container_name: nginx_sjp0005
    ports:
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sjp0005
